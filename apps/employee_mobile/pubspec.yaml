name: voyagerrent_employee
description: VoyagerRent employee application for branch operations, handovers, inspections, damage evidence, and offline task synchronization.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  camera: ^0.11.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.1.0
  flutter_riverpod: ^2.6.1
  google_maps_flutter: ^2.12.1
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.7
  rental_mobile_core:
    path: ../../packages/rental_mobile_core
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
