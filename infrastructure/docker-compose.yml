name: voyagerrent
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../apps/platform:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      platform:
        condition: service_healthy
    networks: [voyagerrent]
    restart: unless-stopped

  platform:
    build:
      context: ..
      dockerfile: infrastructure/docker/php/Dockerfile
    env_file:
      - ../apps/platform/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-voyagerrent}
      DB_USERNAME: ${MYSQL_USER:-voyagerrent}
      DB_PASSWORD: ${MYSQL_PASSWORD:-voyagerrent}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    volumes:
      - ../apps/platform:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [voyagerrent]
    restart: unless-stopped

  queue-critical:
    build:
      context: ..
      dockerfile: infrastructure/docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "redis", "--queue=critical,billing,notifications,exports,default", "--sleep=2", "--tries=5", "--max-time=3600"]
    env_file: [../apps/platform/.env]
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes: [../apps/platform:/var/www/html]
    depends_on:
      platform:
        condition: service_healthy
    networks: [voyagerrent]
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: infrastructure/docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    env_file: [../apps/platform/.env]
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes: [../apps/platform:/var/www/html]
    depends_on:
      platform:
        condition: service_healthy
    networks: [voyagerrent]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voyagerrent}
      MYSQL_USER: ${MYSQL_USER:-voyagerrent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voyagerrent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [voyagerrent]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [voyagerrent]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [voyagerrent]

networks:
  voyagerrent:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
